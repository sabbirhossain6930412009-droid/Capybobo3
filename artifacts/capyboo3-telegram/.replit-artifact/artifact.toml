kind = "web"
previewPath = "/"
title = "Capyboo3 Telegram Bot"
description = "A Telegram Mini App that plays the supplied Capyboo3 loading video, then fills the screen with the full artwork and an Airdrop Coming Soon message box."
version = "1.0.0"
id = "artifacts/capyboo3-telegram"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18452

[services.development]
run = "pnpm --filter @workspace/capyboo3-telegram run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/capyboo3-telegram", "run", "build" ]
serve = "static"
publicDir = "artifacts/capyboo3-telegram/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18452"
BASE_PATH = "/"
